<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speedy Burger – Build your burger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@500;700&display=swap">
<style>
:root{--bg:#FDB105;--card:#fff;--ink:#3a0b08;--muted:#7a4a2a;--red:#E1000F;--line:rgba(58,11,8,.16);--glow:#ffd36b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241008;--card:#341a10;--ink:#fff1d6;--muted:#d9b48a;--red:#ff4a3d;--line:rgba(255,241,214,.18);--glow:#6a3a14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241008;--card:#341a10;--ink:#fff1d6;--muted:#d9b48a;--red:#ff4a3d;--line:rgba(255,241,214,.18);--glow:#6a3a14;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-style:italic;font-weight:900;margin:0;letter-spacing:.01em}
header{background:#FDB105;display:flex;align-items:center;gap:20px;padding:6px 20px;flex-wrap:wrap}
header img{width:170px;height:auto;display:block}
header h1{color:#E1000F;font-size:clamp(28px,5vw,48px);line-height:1}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;max-width:1100px;margin:0 auto;padding:20px}
.stage{position:sticky;top:0;align-self:start;height:min(78vh,640px);border-radius:28px;background:radial-gradient(ellipse at 50% 45%,var(--glow),transparent 70%);overflow:hidden}
.float{position:absolute;inset:0;animation:bob 4.5s ease-in-out infinite}
.layer{position:absolute;left:50%;bottom:64px;width:300px;margin-left:-150px;transform-origin:50% 100%;transition:transform .6s cubic-bezier(.34,1.45,.5,1),opacity .35s;pointer-events:none}
.layer svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 6px rgba(60,20,0,.25))}
.shadow{position:absolute;left:50%;bottom:22px;width:240px;height:26px;margin-left:-120px;border-radius:50%;background:rgba(60,20,0,.3);filter:blur(8px);animation:sh 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes sh{50%{transform:scale(.85);opacity:.7}}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;font:900 22px "Barlow Condensed",Impact,sans-serif;font-style:italic;padding:10px;border-radius:14px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px}
.combo{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid transparent;border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.combo[aria-pressed="true"]{border-color:var(--red)}
.combo b{display:flex;justify-content:space-between;font:900 24px "Barlow Condensed",Impact,sans-serif;font-style:italic;color:var(--red)}
.combo span{color:var(--muted);font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row small{display:block;color:var(--muted)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:38px;height:38px;border-radius:50%;border:2px solid var(--red);background:transparent;color:var(--red);font:700 22px/1 Barlow,sans-serif;cursor:pointer}
.step button:disabled{opacity:.3;cursor:default}
.step output{min-width:18px;text-align:center;font-weight:700}
.chips{display:flex;gap:8px;margin:4px 0 12px}
.chip{flex:1;padding:9px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font:700 15px Barlow,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--red);background:var(--red);color:#fff}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.sum .save{color:var(--red);font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:8px;padding-top:8px}
.total .num{font-size:38px;color:var(--red)}
.send{display:block;text-align:center;text-decoration:none;background:#E1000F;color:#fff;font:900 26px "Barlow Condensed",Impact,sans-serif;font-style:italic;padding:14px;border-radius:16px;margin-top:12px}
.clear{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;margin-top:8px}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
@media (max-width:760px){main{grid-template-columns:1fr;padding:12px}.stage{height:44vh;z-index:5;background-color:var(--bg)}header img{width:120px}}
@media (prefers-reduced-motion:reduce){.float,.shadow{animation:none}.layer{transition-duration:.01s}}
</style>
</head>

    <div id="p1" role="tabpanel" aria-labelledby="t1"></div>
    <div id="p2" role="tabpanel" aria-labelledby="t2" hidden></div>

    <div class="card sum" id="sum" aria-live="polite"></div>
    <div class="chips" role="group" aria-label="Order type">
      <button class="chip" data-mode="Pickup" aria-pressed="true">Pickup</button>
      <button class="chip" data-mode="Delivery" aria-pressed="false">Delivery</button>
    </div>
    <a class="send" id="send" href="#" target="_blank" rel="noopener">Send order on WhatsApp</a>
    <button class="clear" id="clear">Start over</button>
  </section>
</main>

<script>
// ---- EDIT HERE: your WhatsApp number (country code, no + or spaces) and prices ----
const WA = "18760000000";
const BUN = 350, SAVE = 150;
const ING = [
  {id:"patty", n:"Beef patty", p:450, max:3},
  {id:"cheese", n:"Cheese", p:100, max:3},
  {id:"bacon", n:"Bacon", p:180, max:2},
  {id:"tomato", n:"Tomato", p:40, max:1},
  {id:"pickles", n:"Pickles", p:40, max:1},
  {id:"onion", n:"Red onion", p:40, max:1},
  {id:"lettuce", n:"Lettuce", p:40, max:1},
  {id:"fries", n:"Fries", p:300, max:1, side:1},
  {id:"drink", n:"Drink", p:200, max:1, side:1}
];
const ORDER = ["lettuce","onion","pickles","tomato","patty","cheese","bacon"]; // bottom to top
const COMBOS = [
  {id:"classic", n:"Speedy Classic", d:"Patty, cheese, lettuce, tomato, pickles, onion + fries + drink", q:{patty:1,cheese:1,lettuce:1,tomato:1,pickles:1,onion:1,fries:1,drink:1}},
  {id:"double", n:"Double Stack", d:"2 patties, 2 cheese, lettuce, pickles + fries + drink", q:{patty:2,cheese:2,lettuce:1,pickles:1,fries:1,drink:1}},
  {id:"bacon", n:"Bacon Cheese", d:"Patty, cheese, 2 bacon, tomato + fries + drink", q:{patty:1,cheese:1,bacon:2,tomato:1,fries:1,drink:1}}
];
const zero = () => Object.fromEntries(ING.map(i => [i.id, 0]));
const fmt = n => "J$" + n.toLocaleString("en-US");
let q = {...zero(), patty:1}, mode = "Pickup";

// ---- burger art ----
const pts = (y,a,n,ph=0) => { const o=[]; for(let i=0;i<=n*8;i++){ o.push((8+284*i/(n*8)).toFixed(1)+" "+(y+a*Math.sin(i/8*6.283+ph)).toFixed(1)); } return o; };
const seeds = [[90,30,-30],[130,22,0],[170,24,10],[210,32,30],[110,46,-15],[150,42,5],[190,48,20],[70,54,-40],[230,54,35]]
  .map(([x,y,r]) => `<ellipse cx="${x}" cy="${y}" rx="6" ry="3" transform="rotate(${r} ${x} ${y})"/>`).join("");
const wrap = s => `<svg viewBox="0 0 300 90" aria-hidden="true">${s}</svg>`;
const ART = {
  bunTop: () => wrap(`<path d="M10 78C10 22 80 8 150 8S290 22 290 78Q290 86 270 86H30Q10 86 10 78Z" fill="url(#gTop)"/><g fill="#fff3d0">${seeds}</g>`),
  bunBottom: () => wrap(`<path d="M14 30H286Q292 30 288 52Q282 76 240 78H60Q18 76 12 52Q8 30 14 30Z" fill="url(#gBot)"/>`),
  lettuce: () => wrap(`<path d="M${pts(40,8,8).join("L")}L${pts(56,8,8,1.5).reverse().join("L")}Z" fill="url(#gLet)" stroke="#3f8222" stroke-width="3" stroke-linejoin="round"/>`),
  onion: () => wrap(`<ellipse cx="110" cy="48" rx="90" ry="13" fill="none" stroke="#c0509a" stroke-width="6"/><ellipse cx="195" cy="42" rx="90" ry="13" fill="none" stroke="#e7a3d3" stroke-width="6"/>`),
  pickles: () => wrap([60,150,240].map((x,i)=>`<ellipse cx="${x}" cy="${46+(i==1?-4:2)}" rx="42" ry="14" fill="#86a83c" stroke="#5f7f22" stroke-width="3"/><ellipse cx="${x}" cy="${46+(i==1?-4:2)}" rx="26" ry="7" fill="#a9c85a" opacity=".6"/>`).join("")),
  tomato: () => wrap(`<ellipse cx="105" cy="50" rx="98" ry="19" fill="url(#gTom)"/><ellipse cx="195" cy="42" rx="98" ry="19" fill="url(#gTom)"/><ellipse cx="195" cy="38" rx="70" ry="7" fill="#fff" opacity=".18"/>`),
  patty: () => wrap(`<rect x="12" y="26" width="276" height="46" rx="23" fill="url(#gPat)"/><g fill="#2c140a" opacity=".6">${[[50,40],[90,58],[130,38],[170,56],[210,40],[250,56],[70,48],[190,64],[150,46]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="9" ry="3"/>`).join("")}</g>`),
  cheese: () => wrap(`<path d="M18 28H282Q290 28 286 40Q284 46 276 46L270 46V66Q270 76 261 76Q252 76 252 66V47H205V58Q205 66 198 66Q191 66 191 58V47H90V70Q90 80 80 80Q70 80 70 70V47H30Q14 46 14 38Q14 28 18 28Z" fill="url(#gChz)"/>`),
  bacon: () => wrap(`<path d="M${pts(36,7,6).join("L")}" fill="none" stroke="#a42a1a" stroke-width="14" stroke-linecap="round"/><path d="M${pts(36,7,6).join("L")}" fill="none" stroke="#e0705a" stroke-width="4" stroke-linecap="round"/><path d="M${pts(56,7,6,2).join("L")}" fill="none" stroke="#8f2415" stroke-width="14" stroke-linecap="round"/><path d="M${pts(56,7,6,2).join("L")}" fill="none" stroke="#d9634e" stroke-width="4" stroke-linecap="round"/>`)
};

// ---- stack rendering ----
const stage = document.getElementById("stage"), float = document.getElementById("float");
const els = new Map();
function keys(){ const k=["bunBottom"]; ORDER.forEach(id=>{ for(let i=0;i<q[id];i++) k.push(id+"-"+i); }); k.push("bunTop"); return k; }
function renderStack(){
  const list = keys(), W = stage.clientWidth, H = stage.clientHeight;
  const s = Math.min(1, W/340, H/520);
  const avail = H - 64 - 90*s, step = Math.min(66*s, avail/Math.max(list.length-1,1));
  let fresh = 0;
  els.forEach((el,k)=>{ if(!list.includes(k)){ els.delete(k); el.style.opacity=0; el.style.transform=`translateY(${-(parseFloat(el.dataset.y)+140)}px) scale(${s})`; setTimeout(()=>el.remove(),450); } });
  list.forEach((k,i)=>{
    const y = i*step; let el = els.get(k);
    if(!el){
      el = document.createElement("div"); el.className="layer";
      el.innerHTML = ART[k.split("-")[0]]();
      el.style.opacity=0; el.style.transform=`translateY(${-(y+240)}px) scale(${s})`;
      float.appendChild(el); els.set(k,el); el.offsetWidth;
      el.style.transitionDelay = (fresh++*90)+"ms";
    } else el.style.transitionDelay="0ms";
    el.dataset.y=y; el.style.zIndex=i+1; el.style.opacity=1;
    el.style.transform=`translateY(${-y}px) scale(${s})`;
  });
}

// ---- panels ----
const sub = i => i.side ? "Add a side" : "Add layer";
function activeCombo(){ return COMBOS.find(c => ING.every(i => (c.q[i.id]||0) === q[i.id])); }
function price(){ return BUN + ING.reduce((t,i)=>t+q[i.id]*i.p,0) - (activeCombo()?SAVE:0); }
function buildPanels(){
  document.getElementById("p1").innerHTML = COMBOS.map(c => {
    const t = BUN + ING.reduce((s,i)=>s+(c.q[i.id]||0)*i.p,0) - SAVE;
    return `<button class="combo" data-c="${c.id}" aria-pressed="false"><b><em>${c.n}</em><em>${fmt(t)}</em></b><span>${c.d}</span></button>`;
  }).join("");
  document.getElementById("p2").innerHTML = `<div class="card">` + ING.map(i =>
    `<div class="row"><div>${i.n}<small>+${fmt(i.p)}</small></div><div class="step"><button data-i="${i.id}" data-d="-1" aria-label="Remove ${i.n}">−</button><output id="o-${i.id}">0</output><button data-i="${i.id}" data-d="1" aria-label="Add ${i.n}">+</button></div></div>`).join("") + `</div>`;
}
function renderUI(){
  const ac = activeCombo();
  document.querySelectorAll(".combo").forEach(b => b.setAttribute("aria-pressed", ac && ac.id===b.dataset.c));
  ING.forEach(i => {
    document.getElementById("o-"+i.id).textContent = q[i.id];
    const [m,p] = document.querySelectorAll(`[data-i="${i.id}"]`);
    m.disabled = q[i.id]<=0; p.disabled = q[i.id]>=i.max;
  });
  const lines = [["Buns", BUN]].concat(ING.filter(i=>q[i.id]).map(i => [(q[i.id]>1?q[i.id]+" × ":"")+i.n, q[i.id]*i.p]));
  document.getElementById("sum").innerHTML = lines.map(([n,p])=>`<div><span>${n}</span><span>${fmt(p)}</span></div>`).join("")
    + (ac ? `<div class="save"><span>${ac.n} combo saving</span><span>−${fmt(SAVE)}</span></div>` : "")
    + `<div class="total"><span>Total</span><span class="num">${fmt(price())}</span></div>`;
  const msg = `Hi Speedy Burger! I'd like to order (${mode}):\n` + (ac ? `${ac.n} combo\n` : "") + lines.map(([n,p])=>`- ${n}`).join("\n") + `\nTotal: ${fmt(price())}`;
  document.getElementById("send").href = `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
  renderStack();
}

// ---- events ----
document.addEventListener("click", e => {
  const c = e.target.closest("[data-c]"), st = e.target.closest("[data-i]"), m = e.target.closest("[data-mode]"), t = e.target.closest(".tab");
  if(c){ q = {...zero(), ...COMBOS.find(x=>x.id===c.dataset.c).q}; renderUI(); }
  else if(st){ const i = ING.find(x=>x.id===st.dataset.i); q[i.id] = Math.max(0, Math.min(i.max, q[i.id]+ +st.dataset.d)); renderUI(); }
  else if(m){ mode = m.dataset.mode; document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed", b===m)); renderUI(); }
  else if(t){ const one = t.id==="t1"; document.getElementById("t1").setAttribute("aria-selected", one); document.getElementById("t2").setAttribute("aria-selected", !one); document.getElementById("p1").hidden=!one; document.getElementById("p2").hidden=one; }
  else if(e.target.id==="clear"){ q = {...zero(), patty:1}; renderUI(); }
});
window.addEventListener("resize", renderStack);
buildPanels(); renderUI();
</script>
</body>
</html>
